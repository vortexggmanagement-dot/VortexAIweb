<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex AI | Client Authentication & Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vortex: {
              bg: '#06080F',
              card: 'rgba(15, 23, 42, 0.75)',
              border: '#1E293B',
              cyan: '#06B6D4',
              indigo: '#6366F1'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#06080F] text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased selection:bg-cyan-500 selection:text-black">

  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-2xl shadow-2xl shadow-cyan-500/10">
    
    <!-- Logo & Tajuk -->
    <div class="text-center mb-8">
      <div class="inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 items-center justify-center font-bold text-white text-xl shadow-lg shadow-cyan-500/20 mb-3">
        V
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Access Vortex AI Portal</h1>
      <p class="text-xs text-slate-400 mt-1 font-mono">Autonomous Corporate Intelligence & Virtual CFO</p>
    </div>

    <!-- Pilihan Tab: Log Masuk vs Daftar Baru -->
    <div class="flex border-b border-slate-800 mb-6">
      <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-cyan-400 border-b-2 border-cyan-400 transition-all">
        Create Client Account
      </button>
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-300 transition-all">
        Existing Client Sign In
      </button>
    </div>

    <!-- Borang Input -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      
      <!-- Nama Syarikat (Hanya untuk pendaftaran baharu) -->
      <div id="company-field">
        <label class="block text-xs font-medium text-slate-400 mb-1">Company / Enterprise Name</label>
        <input type="text" id="company-name" placeholder="e.g. Acme Holdings Inc." class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-cyan-500 text-white placeholder-slate-600 transition-colors" />
      </div>

      <!-- Emel Klien -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Business Email Address</label>
        <input type="email" id="email" required placeholder="founder@company.com" class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-cyan-500 text-white placeholder-slate-600 transition-colors" />
      </div>

      <!-- Kata Laluan -->
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Secure Password</label>
        <input type="password" id="password" required placeholder="••••••••••••" class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-sm focus:outline-none focus:border-cyan-500 text-white placeholder-slate-600 transition-colors" />
      </div>

      <!-- Butang Tindakan -->
      <button type="submit" id="submit-btn" class="w-full py-3 mt-2 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold text-xs uppercase tracking-wider hover:brightness-110 shadow-lg shadow-cyan-500/20 transition-all">
        Start 7-Day Free Trial (Enter Dashboard)
      </button>

    </form>

    <!-- Penafian Keselamatan -->
    <p class="text-[11px] text-slate-500 text-center mt-6 leading-relaxed">
      Protected by 256-bit encryption. By registering, you agree to Vortex AI's Terms of Service and Financial Modeling Disclaimer.
    </p>

    <!-- Pautan Balik ke Laman Utama -->
    <div class="text-center mt-4">
      <a href="index.html" class="text-xs text-cyan-400 hover:underline">← Back to Main Public Site</a>
    </div>

  </div>

  <script>
    let currentMode = 'register';

    function switchTab(mode) {
      currentMode = mode;
      const companyField = document.getElementById('company-field');
      const submitBtn = document.getElementById('submit-btn');
      const tabRegister = document.getElementById('tab-register');
      const tabLogin = document.getElementById('tab-login');

      if (mode === 'register') {
        companyField.classList.remove('hidden');
        submitBtn.innerText = 'Start 7-Day Free Trial (Enter Dashboard)';
        tabRegister.className = 'flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-cyan-400 border-b-2 border-cyan-400 transition-all';
        tabLogin.className = 'flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-300 transition-all';
      } else {
        companyField.classList.add('hidden');
        submitBtn.innerText = 'Sign In to Workspace';
        tabLogin.className = 'flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-cyan-400 border-b-2 border-cyan-400 transition-all';
        tabRegister.className = 'flex-1 pb-3 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-300 transition-all';
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const company = document.getElementById('company-name').value || 'Global Client Workspace';

      // Simpan sesi klien secara setempat untuk demonstrasi aliran
      localStorage.setItem('vortex_user_email', email);
      localStorage.setItem('vortex_company_name', company);
      localStorage.setItem('vortex_auth_status', 'active');

      // Halakan terus masuk ke papan pemuka klien
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
